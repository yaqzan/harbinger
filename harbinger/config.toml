# Harbinger model settings, shared by everyone who runs it. Every tunable number lives here.
# Your own settings (Steam account, watched games, push) go in config.local.toml at the repo
# root, which is merged over this file and never committed. See config.local.example.toml.
# Change a value, then `py -3.11 -m harbinger build` to re-score without re-fetching.

[sheet]
id = "1kspw-4paT-eE5-mrCrc4R9tg70lH2ZTFrJOUmOtOytg"   # public; downloaded whole as xlsx, tabs picked by name
days_per_month = 30.4375   # add date = as_of - Months * this

[scope]
# Xbox console Game Pass only. Sheet rows whose System is exactly one of these are left out of
# the model, the title matching and the page (the database still imports them). "PC" is PC Game
# Pass only; "Xbox / PC" games stay. Set [] in config.local.toml to include PC.
skip_systems = ["PC"]

[waves]
cohorts = [12, 18, 24, 36]  # anniversary months that can trigger a removal
horizon = 4                 # waves shown on the watchlist and chart
notice_days = 13            # official notice lands about this long before a wave
# Only these count as confirming a leaver. A leaver reported only elsewhere (Insider Gaming,
# a forum) shows on the page tagged unverified and is left out of the counts.
trusted_sources = ["Xbox Wire", "Pure Xbox"]

[base_rates]
# Leave probability at each anniversary, measured from the sheet on 2026-10-09 (option C in
# .claude/docs/model.md): 12-month from 2025 adds only, since recent deals set current contract lengths;
# the rest from all third-party history. Prototype values were 0.38 / 0.20 / 0.35 / 0.30.
12 = 0.39
18 = 0.19
24 = 0.33
36 = 0.13

[multipliers]
# Applied to the odds (p / (1 - p)), then converted back.
# 1.77 on a 12-month game gives ~53% (tuned to ~52% on the old 38% base; spec said "~2.0").
forecast_listed = 1.77
forecast_unlikely = 0.45    # listed but flagged unlikely to leave
forecast_absent = 0.5       # the wave's month has a forecast and the game isn't on it
on_premium = 0.8            # also in the Premium tier catalogue
premium_readd = 0.6         # joined Premium months after Ultimate (a fresh deal)
premium_readd_gap_months = 2

[bands]
likely = 0.45
possible = 0.25

[play]
hours_per_week = 9
buffer_weeks = 2
doable_share = 0.75   # Doable if hours <= this share of the hours available; Tight up to all of them
soon_weeks = 4        # "Start within 4 wks"

[alerts]
# Pushes for your queued games ([queue] tracking), sent by `ingest --push`. Each fires once per
# game and wave: a heads-up lead_days before the start-by date (room to prep), then "start now"
# on it. Start-by already keeps [play] buffer_weeks before the wave.
lead_days = 14
min_p = 0.25   # modelled leave odds a queued game needs to push (the Possible band); confirmed always pushes
# One push for games newly added to Game Pass Premium or to PS Plus Extra/Premium (your tier and
# below; not the Essential monthly games). Looks back arrival_days of sheet imports, so a manual
# ingest without --push doesn't swallow them. Set arrivals = false to turn it off.
arrivals = true
arrival_days = 7

[exclude]
# Owner-notes markers for collections that are not a normal third-party deal.
ubisoft_note = "Ubisoft games joining with price increase"
retro_note = "Retro Classics"
ea_note = "Joined EA Play"

[playstation]
# u/ABattleVet's "Complete NA Playstation Plus Master List" (public, same author as [sheet]).
sheet_id = "19RorxFhWc2lHocg4c9zrVssSwZq1u2nPcpTsAvzdJQw"
# Your PS Plus tier: none | essential | extra | premium (each includes the tiers below it).
# Set yours in config.local.toml. "none" leaves PlayStation off the page.
tier = "none"
vr = false   # VR-only games stay hidden; set true in config.local.toml if you have a headset
hard_trophy_rate = 2.0      # flag "100% looks hard" when trophies you lack are rarer than this % of players
cohorts = [12, 18, 24, 36]  # removals land on the third Monday of the month (308 of 351 since 2024)

# Leave probability at each anniversary, measured from the PS Plus sheet on 2026-10-09 with the
# Game Pass method: 12-month from 2024+ adds (166 games; all history gives 24%), the rest from
# all history.
[playstation.base_rates.extra]   # third-party; Sony's own games are measured apart (2026-10-09)
12 = 0.35
18 = 0.05
24 = 0.17
36 = 0.03

# Sony first-party on Extra or Premium (titles.toml [first_party]), measured 2026-10-09 over 110
# games: 1 of 100 left at 12 months, 2 of 96 at 18, none at 24 or 36. The few removals were
# flagships pulled before a new entry or edition went on sale (Spider-Man GOTY, Horizon Zero
# Dawn Complete, Forbidden West); both series came back as the newer edition ~2 years later.
[playstation.base_rates.sony]
12 = 0.01
18 = 0.02
24 = 0.0
36 = 0.0

[playstation.base_rates.premium]    # Premium Classics, Remasters, VR
12 = 0.05
18 = 0.01
24 = 0.01
36 = 0.0

[playstation.base_rates.streaming]  # Premium (Streaming Only): none has left at an anniversary
12 = 0.0
18 = 0.0
24 = 0.0
36 = 0.0

# Cover art next to each game, cached in harbinger/state/art/ and served by this server.
[art]
enabled = true
budget = 150      # new lookups per ingest (a first run fills in over a few days)
retry_days = 14   # look again for a game nothing had art for
max_px = 240      # longest side kept, when Pillow is installed
pause_s = 0.2     # between lookups

# Your watched games: set them in config.local.toml, not here.
[queue]
gone = []
tracking = []
beaten = []

# Leavers reported somewhere but not on the sheet. Shown, flagged unverified.
[[manual_confirmed]]
game = "Superball"
wave = "2026-10-15"
source = "Insider Gaming only; not on the sheet"
