# Title corrections between the Game Pass sheet and other sources (Steam, the forecast, your
# queue). Shared by everyone who runs Harbinger: these are facts about titles, not settings.
#
# `py -3.11 -m harbinger titles` lists the weak matches and near misses. Settle one here, then
# `py -3.11 -m harbinger build`. Case, punctuation, ™/® and roman numerals don't matter.

# Same game, different spelling: "title elsewhere" = "title on the sheet"
# A bundle can name every sheet game in it: "A & B" = ["A", "B"]
[same]
"Atlas Fallen" = "Atlas Fallen: Reign of Sand"
"Beyond Good & Evil" = "Beyond Good & Evil HD"
"Don't Starve" = "Don't Starve: Giant Edition"
"GoNNER" = "GoNNER: Blueberry Edition"
"Hearts of Iron IV" = "Hearts of Iron IV: Cadet Edition"
"Heroes of Might & Magic III - HD Edition" = "Heroes of Might and Magic III: Complete Edition"
"Hollow Knight" = "Hollow Knight: Voidheart Edition"
"Laser League: World Arena" = "Laser League"
"Mafia II (Classic)" = "Mafia II"
"Monkey Island 2: Special Edition" = "Monkey Island 2 Special Edition: LeChuck's Revenge"
"NieR:Automata" = "NieR Automata: Become as Gods Edition"
"Out of Space" = "Out of Space: Couch Edition"
"PAYDAY 2" = "Payday 2: Crimewave Edition"
"Plants vs. Zombies: Game of the Year" = "Plants vs. Zombies: Game of the Year Edition"
"Project Highrise" = "Project Highrise: Architect's Edition"
"Sudden Strike 4" = "Sudden Strike 4 - Complete Collection"
"The Bookwalker" = "The Bookwalker: Thief of Tales"
"The Witcher 3: Wild Hunt - Remastered" = "The Witcher 3: Wild Hunt"
"Trine 2" = "Trine 2: Complete Story"
"The Elder Scrolls IV: Oblivion Game of the Year Edition (2009)" = "The Elder Scrolls IV: Oblivion"
"The Walking Dead" = "The Walking Dead: The Complete First Season"
"Valiant Hearts: The Great War / Soldats Inconnus : Memoires de la Grande Guerre" = "Valiant Hearts: The Great War"
# PS Plus titles (Steam or Game Pass spelling = PS Plus spelling)
"Bad North: Jotunn Edition" = "Bad North"
"Cat Quest II" = "Cat Quest II: The Lupus Empire"
"Far Cry 3" = "Far Cry 3: Classic Edition"
"Far Cry 3: Blood Dragon" = "Far Cry 3: Blood Dragon - Classic Edition"
"For Honor: Marching Fire Edition" = "For Honor"
"Never Alone" = "Never Alone (Kishima Ingitchuna)"
"The Elder Scrolls Online" = "The Elder Scrolls Online: Tamriel Unlimited"
"This War of Mine" = "This War of Mine: Final Cut"
"Warhammer: Chaosbane" = "Warhammer: Chaosbane - Slayer Edition"
"World War Z: Aftermath" = "World War Z"
# One game, two catalogue names: Game Pass lists it with the Road to Elysium DLC (owner, 2026-10-09)
"The Talos Principle 2" = "The Talos Principle 2: Road to Elysium"
"The Talos Principle 2: Road to Elysium" = "The Talos Principle 2"
# A Steam copy that already is the preferred edition (otherwise a plain copy doesn't own a remaster)
"Cities: Skylines" = "Cities: Skylines - Remastered"   # the console port of the full PC game
"Wasteland 2" = "Wasteland 2: Director's Cut"          # free upgrade for every Steam owner
# Forecast spellings (checked loose matches)
"Bounty Star" = "Bounty Star: The Morose Tale of Graveyard Clem"
"MechWarriror 5: Clans" = "Mechwarrior 5: Clans"
"Sopa" = "Sopa: Tale of the Stolen Potato"
"Starcraft 2" = "Starcraft II: Campaign Collection"
# Forecast bundles
"Baldur's Gate & Baldur's Gate 2: Enhanced Editions" = ["Baldur's Gate: Enhanced Edition", "Baldur's Gate II: Enhanced Edition"]
"Heroes of Might and Magic 2 & 3" = ["Heroes of Might and Magic II: Gold Edition", "Heroes of Might and Magic III: Complete Edition"]

