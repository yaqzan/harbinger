# Your own Harbinger settings. Copy this file to config.local.toml (same folder) and fill it in.
# config.local.toml is gitignored, so your Steam account and game list never get committed.
# Anything here is merged over harbinger/config.toml, so you can also override a model number.

[steam]
# Your SteamID64 (17 digits) or the custom name from your profile URL
# (steamcommunity.com/id/<this part>). In the Steam app: click your name, then Account details.
id = ""
# Your Steam Web API key, from https://steamcommunity.com/dev/apikey (needs a browser; the domain
# you enter there can be anything). Leave it empty if you'd rather set the STEAM_API_KEY
# environment variable instead. Environment variables win over this file.
api_key = ""
# Steam only shares your library if your profile's "Game details" privacy setting is Public.

[playstation]
# Your PS Plus tier: none | essential | extra | premium. Each includes the tiers below it, so
# "extra" covers the Essential monthly games too. "none" keeps PlayStation off the page.
tier = "none"
# Your PlayStation library counts as owned, like Steam. Bought games come from PSN: sign in
# at playstation.com, open https://ca.account.sony.com/api/v1/ssocookie in the same browser and
# put the "npsso" value in the PSN_NPSSO environment variable (or npsso = "..." here). It
# lasts about two months. Disc games can't be seen by any API, so list them here.
discs = [
  # "Demon's Souls",
]

[queue]
# Watched games. These get their own "Your queue" table with the next date each one could leave,
# even when the model doesn't rate them as likely to go.
#
# tracking: Game Pass or PS Plus games (your [playstation] tier) you are playing now, or plan to play
#   and would mind losing.
#   A good rule of thumb: anything you'd be annoyed to find gone halfway through.
# gone: games you were tracking that already left. Kept so the page notices if one comes back.
# beaten: games you've finished or 100%'d. Never pushed about, even when confirmed leaving.
#   (A game you own with every achievement or trophy is already quiet: it's yours.)
#
# Titles are matched loosely against the Game Pass sheet, then your PS Plus tier ("Metaphor" finds
# "Metaphor: ReFantazio"); the page tells you if one can't be found. A game on both services
# follows the copy that is safe for longer; the other one shows in its note.
tracking = [
  # "Hollow Knight: Silksong",
  # "Clair Obscur: Expedition 33",
]
gone = []
beaten = []

[push]
# Optional phone alerts via Pharos (github.com/yaqzan/pharos): a newly confirmed leaver, a queued
# game to start soon (two weeks before its start-by date, then on it; timing in [alerts] in config.toml),
# and games newly added to Game Pass Premium or your PS Plus tier.
# Leave dir empty to look for a Pharos folder next to this repo; set enabled = false to skip.
enabled = true
dir = ""
# Link the push opens. Leave empty for no link.
url = ""
